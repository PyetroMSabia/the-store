<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a241e"/>
      <stop offset="1" stop-color="#17130f"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset=".5" stop-color="#7b5233"/>
      <stop offset="1" stop-color="#523420"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#f5d061" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f5d061" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#wall)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <rect y="720" width="800" height="80" fill="#0e0c0a"/>
  <ellipse cx="400" cy="725" rx="220" ry="16" fill="#000" opacity=".7" filter="url(#soft)"/>
  <!-- frame -->
  <g fill="#0b0b0c">
    <rect x="210" y="80" width="14" height="645"/>
    <rect x="576" y="80" width="14" height="645"/>
  </g>
  <path d="M224 120 L576 240 M576 120 L224 240 M224 250 L576 370 M576 250 L224 370 M224 380 L576 500 M576 380 L224 500 M224 510 L576 630 M576 510 L224 630" stroke="#0b0b0c" stroke-width="3" opacity=".6"/>
  <!-- shelves -->
  <g>
    <rect x="200" y="100" width="400" height="18" fill="url(#walnut)"/>
    <rect x="200" y="230" width="400" height="18" fill="url(#walnut)"/>
    <rect x="200" y="360" width="400" height="18" fill="url(#walnut)"/>
    <rect x="200" y="490" width="400" height="18" fill="url(#walnut)"/>
    <rect x="200" y="620" width="400" height="18" fill="url(#walnut)"/>
  </g>
  <g fill="#c9971c" opacity=".55">
    <rect x="200" y="100" width="400" height="3"/><rect x="200" y="230" width="400" height="3"/>
    <rect x="200" y="360" width="400" height="3"/><rect x="200" y="490" width="400" height="3"/>
    <rect x="200" y="620" width="400" height="3"/>
  </g>
  <!-- books row 1 -->
  <g>
    <rect x="240" y="150" width="22" height="80" fill="#e9dcc7"/>
    <rect x="264" y="160" width="18" height="70" fill="#7b2e2e"/>
    <rect x="284" y="145" width="24" height="85" fill="#1f3a4d"/>
    <rect x="310" y="165" width="16" height="65" fill="#c9971c"/>
    <rect x="335" y="200" width="70" height="30" rx="4" fill="#cdbb9f"/>
  </g>
  <!-- plant -->
  <path d="M480 230 L488 190 L532 190 L540 230 Z" fill="#efe7da"/>
  <g fill="#4f7a4a">
    <ellipse cx="495" cy="165" rx="10" ry="28" transform="rotate(-30 495 165)"/>
    <ellipse cx="525" cy="160" rx="10" ry="30" transform="rotate(25 525 160)"/>
    <ellipse cx="510" cy="150" rx="9" ry="34"/>
  </g>
  <!-- row 2 -->
  <circle cx="290" cy="320" r="38" fill="#efe7da"/>
  <circle cx="290" cy="320" r="20" fill="#d8ccb8"/>
  <g>
    <rect x="420" y="285" width="20" height="75" fill="#2b2b2e"/>
    <rect x="442" y="295" width="18" height="65" fill="#e9dcc7"/>
    <rect x="462" y="280" width="22" height="80" fill="#5a3a22"/>
    <rect x="486" y="300" width="16" height="60" fill="#7b2e2e"/>
    <rect x="510" y="292" width="20" height="68" fill="#c9971c" transform="rotate(12 520 360)"/>
  </g>
  <!-- row 3 -->
  <path d="M260 490 Q260 420 300 420 Q340 420 340 490 Z" fill="#b65c3a"/>
  <rect x="440" y="440" width="110" height="50" rx="4" fill="#1f3a4d"/>
  <rect x="452" y="452" width="86" height="4" fill="#c9971c"/>
  <!-- row 4 -->
  <g>
    <rect x="250" y="545" width="24" height="75" fill="#e9dcc7"/>
    <rect x="276" y="555" width="20" height="65" fill="#2b2b2e"/>
    <rect x="298" y="540" width="22" height="80" fill="#7b5233"/>
  </g>
  <path d="M470 620 L478 585 L522 585 L530 620 Z" fill="#2b2b2e"/>
  <g fill="#6b8f5e">
    <ellipse cx="490" cy="570" rx="8" ry="20" transform="rotate(-35 490 570)"/>
    <ellipse cx="512" cy="566" rx="8" ry="22" transform="rotate(30 512 566)"/>
  </g>
</svg>
